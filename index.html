<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Fantasy | Ultimate F1 League</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #0d0d0d; font-family: 'Rajdhani', sans-serif; color: #e5e5e5; }
        .f1-font { font-family: 'Orbitron', sans-serif; }
        .gold-grad { background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block !important; }
    </style>
</head>
<body>

    <nav class="border-b border-[#2A2A2A] bg-[#121212] px-6 py-4 flex justify-between items-center relative z-50">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-6 bg-gradient-to-b from-[#BF953F] to-[#AA771C] transform -skew-x-12"></div>
            <span class="f1-font text-xl font-black tracking-wider text-white">ULTIMATE <span class="gold-grad">FANTASY</span></span>
        </div>
        <div class="flex space-x-6 text-sm font-bold tracking-widest uppercase f1-font">
            <button onclick="cambiarPestana('equipo')" id="btn-equipo" class="text-[#BF953F] border-b-2 border-[#BF953F] pb-1 cursor-pointer">Mi Equipo</button>
            <button onclick="cambiarPestana('alineacion')" id="btn-alineacion" class="text-gray-400 hover:text-[#BF953F] transition cursor-pointer">Alineacion</button>
            <button onclick="cambiarPestana('clasificacion')" id="btn-clasificacion" class="text-gray-400 hover:text-[#BF953F] transition cursor-pointer">Clasificacion</button>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-[#161616] border border-[#2A2A2A] rounded-xl p-6 flex justify-between items-center">
            <h1 id="titulo-pantalla" class="text-2xl font-black text-white f1-font">Mi Escuderia</h1>
            <div class="flex gap-8">
                <div class="text-center"><p class="text-xs text-gray-500">PRESUPUESTO</p><p id="presupuesto-txt" class="text-3xl font-bold text-emerald-400 f1-font">$100M</p></div>
                <div class="text-center"><p class="text-xs text-gray-500">PILOTOS</p><p id="contador-pilotos" class="text-3xl font-bold text-white f1-font">0 / 5</p></div>
            </div>
        </div>
    </header>

    <main id="pantalla-equipo" class="tab-content active max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div id="mi-equipo-lista" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            <div id="mi-constructor-zona" class="bg-[#161616] border border-dashed border-[#333] rounded-xl p-6 text-gray-500">Selecciona un constructor en el mercado.</div>
        </div>
        <div class="space-y-6">
            <select id="select-constructor" class="w-full bg-[#1f1f1f] border border-[#333] p-2 text-white" onchange="seleccionarConstructor()">
                <option value="">-- Selecciona Constructor --</option>
                <option value="Ferrari-22">Ferrari ($22M)</option>
                <option value="RedBull-22">Red Bull ($22M)</option>
                <option value="McLaren-22">McLaren ($22M)</option>
                <option value="Mercedes-22">Mercedes ($22M)</option>
                <option value="Aston-15">Aston Martin ($15M)</option>
                <option value="Alpine-15">Alpine ($15M)</option>
                <option value="Audi-15">Audi ($15M)</option>
                <option value="Haas-8">Haas ($8M)</option>
                <option value="Williams-8">Williams ($8M)</option>
                <option value="Cadillac-8">Cadillac ($8M)</option>
                <option value="AlphaTauri-8">AlphaTauri ($8M)</option>
            </select>
            <div id="mercado-pilotos" class="space-y-2"></div>
        </div>
    </main>

    <main id="pantalla-alineacion" class="tab-content max-w-7xl mx-auto px-4 pb-12">
        <div id="alineacion-view" class="bg-[#161616] border border-[#2A2A2A] rounded-xl p-6 text-white"></div>
    </main>

    <main id="pantalla-clasificacion" class="tab-content max-w-7xl mx-auto px-4 pb-12">
        <div class="bg-[#161616] border border-[#2A2A2A] rounded-xl p-6 text-white">Clasificacion pendiente...</div>
    </main>

    <script>
        const pilotosDatos = [
            { nombre: "Alvaro", cat: "TOP", precio: 25 }, { nombre: "Asenjo", cat: "TOP", precio: 25 },
            { nombre: "Pablo", cat: "Media", precio: 18 }, { nombre: "Mariux", cat: "Media", precio: 18 }
        ];
        let presupuesto = 100;
        let misPilotos = [];
        let miConstructor = null;

        function cambiarPestana(p) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.getElementById('pantalla-' + p).classList.add('active');
            document.getElementById('titulo-pantalla').innerText = p.charAt(0).toUpperCase() + p.slice(1);
        }

        function ficharPiloto(nombre) {
            const p = pilotosDatos.find(x => x.nombre === nombre);
            if(misPilotos.length < 5 && presupuesto >= p.precio) {
                presupuesto -= p.precio;
                misPilotos.push(p);
                actualizarUI();
            }
        }

        function seleccionarConstructor() {
            const val = document.getElementById('select-constructor').value;
            if(val) {
                const [n, p] = val.split('-');
                miConstructor = { nombre: n, precio: parseInt(p) };
            } else { miConstructor = null; }
            actualizarUI();
        }

        function actualizarUI() {
            document.getElementById('presupuesto-txt').innerText = '$' + presupuesto + 'M';
            document.getElementById('contador-pilotos').innerText = misPilotos.length + ' / 5';
            
            const cont = document.getElementById('mercado-pilotos');
            cont.innerHTML = '';
            pilotosDatos.forEach(p => {
                cont.innerHTML += `<button onclick="ficharPiloto('${p.nombre}')" class="block w-full bg-[#222] p-2 text-white border border-gray-700 hover:bg-[#333]">${p.nombre} ($${p.precio}M)</button>`;
            });

            const lista = document.getElementById('mi-equipo-lista');
            lista.innerHTML = '';
            misPilotos.forEach(p => {
                lista.innerHTML += `<div class="bg-[#222] p-4 text-white rounded border border-gray-700">${p.nombre}</div>`;
            });

            const alin = document.getElementById('alineacion-view');
            alin.innerHTML = `<h3>Constructor: ${miConstructor ? miConstructor.nombre : 'Ninguno'}</h3><div class='mt-4'>Pilotos: ${misPilotos.map(p => p.nombre).join(', ')}</div>`;
        }
        
        window.onload = actualizarUI;
    </script>
</body>
</html>
