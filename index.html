<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Fantasy F1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; font-family: 'Rajdhani', sans-serif; color: #e5e5e5; }
        .f1-font { font-family: 'Orbitron', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block !important; }
    </style>
</head>
<body>

    <nav class="border-b border-[#2A2A2A] bg-[#121212] px-6 py-4 flex justify-between items-center">
        <span class="f1-font text-xl font-black text-white">ULTIMATE FANTASY</span>
        <div class="flex space-x-6 text-sm font-bold uppercase f1-font">
            <button onclick="cambiarPestana('equipo')" id="btn-equipo" class="text-[#BF953F] border-b-2 border-[#BF953F] pb-1">Equipo</button>
            <button onclick="cambiarPestana('alineacion')" id="btn-alineacion" class="text-gray-400">Alineacion</button>
            <button onclick="cambiarPestana('clasificacion')" id="btn-clasificacion" class="text-gray-400">Clasificacion</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <section id="pantalla-equipo" class="tab-content active">
            <h2 class="text-2xl font-bold mb-4">Mercado de Pilotos</h2>
            <select id="select-constructor" class="w-full bg-[#1f1f1f] p-3 mb-6 border border-gray-700" onchange="seleccionarConstructor()">
                <option value="">-- Selecciona Escudería (11 disponibles) --</option>
                <option value="Ferrari-22-https://logo.clearbit.com/ferrari.com">Ferrari ($22M)</option>
                <option value="RedBull-22-https://logo.clearbit.com/redbullracing.com">Red Bull ($22M)</option>
                <option value="McLaren-22-https://logo.clearbit.com/mclaren.com">McLaren ($22M)</option>
                <option value="Mercedes-22-https://logo.clearbit.com/mercedesamgf1.com">Mercedes ($22M)</option>
                <option value="Aston Martin-15-https://logo.clearbit.com/astonmartin.com">Aston Martin ($15M)</option>
                <option value="Alpine-15-https://logo.clearbit.com/alpine-cars.co.uk">Alpine ($15M)</option>
                <option value="Audi-15-https://logo.clearbit.com/audi.com">Audi ($15M)</option>
                <option value="Haas-8-https://logo.clearbit.com/haasf1team.com">Haas ($8M)</option>
                <option value="Williams-8-https://logo.clearbit.com/williamsf1.com">Williams ($8M)</option>
                <option value="Cadillac-8-https://logo.clearbit.com/cadillac.com">Cadillac ($8M)</option>
                <option value="AlphaTauri-8-https://logo.clearbit.com/alphatauri.com">AlphaTauri ($8M)</option>
            </select>
            <div id="mercado-pilotos" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section id="pantalla-alineacion" class="tab-content">
            <div id="alineacion-display" class="p-6 bg-[#161616] border border-gray-800"></div>
        </section>
    </main>

        let misPilotos = [];

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('pantalla-' + p).classList.add('active');
            if(p === 'alineacion') renderizarAlineacion();
        }
